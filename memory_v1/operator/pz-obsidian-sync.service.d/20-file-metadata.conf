[Service]
# Obsidian Headless applies remote mtimes after downloading shared vault
# files.  Those files are intentionally owned by pzmemory, so pzobsidian
# needs this single capability for metadata updates; it does not grant DAC
# override or expand the service's existing vault sandbox.
CapabilityBoundingSet=CAP_FOWNER
AmbientCapabilities=CAP_FOWNER
